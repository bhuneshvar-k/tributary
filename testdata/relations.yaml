# Real instance of tributary.schema.yaml against testdata/fixture.sql, used
# by internal/graph's closure tests. dependency_breaks for employees is
# deliberately omitted here — the cycle tests construct that case
# programmatically to exercise both the best-effort and explicit-break
# paths against the same base relations.

relations:
  # soft FK — orders.user_id has no DB constraint against users.id
  - from: orders.user_id
    to: users.id

  # polymorphic association
  - from: comments.commentable_id
    polymorphic_type: comments.commentable_type
    targets:
      Post: posts.id
      Photo: photos.id

  # suppress the real FK audit_logs.actor_id -> users.id
  - ignore: audit_logs.actor_id
